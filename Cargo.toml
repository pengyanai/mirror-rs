[package]
name = "mirror-rs"
version = "0.1.1"
edition = "2021"
description = "Seamless, transparent Docker registry mirror proxy with speed-based load balancing"
license = "MIT"

[[bin]]
name = "mirror-rs"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
bytes = "1"
http = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
anyhow = "1"
thiserror = "1"
http-auth = { version = "0.1", default-features = false }
moka = { version = "0.12", features = ["future"] }
dirs = "5"

[profile.release]
opt-level = 3
lto = true
strip = true
